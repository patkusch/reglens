name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The README promises Python 3.10+; 3.14 is the newest.
        python-version: ["3.10", "3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m compileall -q reglens
      - run: python -c "import reglens, reglens.config, reglens.models; print(reglens.__version__)"
      - name: graph, scenario arithmetic, recommendation, card, and the committed example
        run: python -m pytest -q
