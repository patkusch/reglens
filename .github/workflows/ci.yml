name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q reglens
      - run: python -c "import reglens, reglens.config, reglens.models; print(reglens.__version__)"
