name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m compileall -q reglens
      - run: python -c "import reglens, reglens.config, reglens.models; print(reglens.__version__)"
      - name: graph, scenario arithmetic, recommendation, card, and the committed example
        run: python -m pytest -q
